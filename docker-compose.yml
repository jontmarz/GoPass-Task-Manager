version: '3.8'

# Define las redes personalizadas
networks:
  task-manager-net:
    driver: bridge

# Define los volúmenes para persistencia de datos
volumes:
  postgres-data:
    driver: local

services:
  # Servicio de la Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: task-manager-db
    # Estas credenciales deben coincidir con las de tu DATABASE_URL en backend/.env
    # Para producción, es imperativo usar un sistema de gestión de secretos.
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - task-manager-net
    restart: unless-stopped

  # Servicio del Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-manager-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      - postgres
    networks:
      - task-manager-net
    restart: unless-stopped

  # Servicio del Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - task-manager-net
    restart: unless-stopped