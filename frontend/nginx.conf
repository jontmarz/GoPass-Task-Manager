server {
    listen 80;
    server_name localhost;

    # Directorio raíz donde se encuentran los archivos estáticos de la SPA
    root /usr/share/nginx/html;
    index index.html;

    # Configuración para servir los archivos y manejar el enrutamiento del lado del cliente
    location / {
        # Intenta servir el archivo solicitado, luego un directorio, y si no,
        # redirige a index.html para que React Router maneje la ruta.
        try_files $uri $uri/ /index.html;
    }
}